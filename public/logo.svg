<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0806" />
      <stop offset="50%" stop-color="#030202" />
      <stop offset="100%" stop-color="#0d0905" />
    </linearGradient>

    <!-- Outer Golden Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb700" />
      <stop offset="35%" stop-color="#ff8c00" />
      <stop offset="70%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#ffa000" />
    </linearGradient>

    <!-- Inner Border Gradient -->
    <linearGradient id="innerBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ff6f00" />
    </linearGradient>

    <!-- Sun Disk Gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="40%" stop-color="#ffb300" />
      <stop offset="80%" stop-color="#ff6f00" />
      <stop offset="100%" stop-color="#e65100" />
    </radialGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ff5722" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Book Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="30%" stop-color="#ffca28" />
      <stop offset="70%" stop-color="#ffa000" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>

    <!-- Book Inner Shadows/Details -->
    <linearGradient id="pageDetail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffe082" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0.7" />
    </linearGradient>

    <!-- Text GPT Gradient -->
    <linearGradient id="gptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff6f00" />
    </linearGradient>

    <!-- Gold Text Accent -->
    <linearGradient id="subtextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffca28" />
      <stop offset="50%" stop-color="#ffe082" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="90" fill="url(#bgGrad)" />

  <!-- Outer Rounded Border (Double Line Effect) -->
  <rect x="14" y="14" width="484" height="484" rx="76" fill="none" stroke="url(#borderGrad)" stroke-width="6" />
  <rect x="22" y="22" width="468" height="468" rx="68" fill="none" stroke="url(#innerBorderGrad)" stroke-width="2.5" opacity="0.85" />

  <!-- SUN & GLOW -->
  <!-- Sun Outer Glow -->
  <circle cx="256" cy="180" r="120" fill="url(#sunGlow)" />
  
  <!-- Sun Disk -->
  <circle cx="256" cy="180" r="82" fill="url(#sunGrad)" stroke="#ffd54f" stroke-width="2" />

  <!-- 4-Pointed Star Inside Sun -->
  <path d="M 256 128 
           Q 256 180 204 180 
           Q 256 180 256 232 
           Q 256 180 308 180 
           Q 256 180 256 128 Z" 
        fill="#080503" />

  <!-- OPEN BOOK (GOLDEN PAGES FANNING UPWARDS) -->
  <g transform="translate(0, -10)">
    <!-- Back Page Glow / Layer 3 -->
    <path d="M 256 295 
             C 210 240, 140 240, 95 258 
             C 140 252, 210 252, 256 300 
             C 302 252, 372 252, 417 258 
             C 372 240, 302 240, 256 295 Z" 
          fill="url(#bookGrad)" opacity="0.75" />

    <!-- Page Layer 2 -->
    <path d="M 256 302 
             C 210 255, 135 250, 85 272 
             C 135 264, 210 264, 256 308 
             C 302 264, 377 264, 427 272 
             C 377 250, 302 255, 256 302 Z" 
          fill="url(#bookGrad)" opacity="0.9" />

    <!-- Main Front Pages (Layer 1) -->
    <!-- Left Wing -->
    <path d="M 256 312 
             C 205 270, 130 260, 75 285 
             C 85 315, 170 318, 256 332 Z" 
          fill="url(#bookGrad)" />
    <path d="M 256 312 
             C 205 270, 130 260, 75 285 
             C 120 280, 200 288, 256 322 Z" 
          fill="url(#pageDetail)" opacity="0.6" />

    <!-- Right Wing -->
    <path d="M 256 312 
             C 307 270, 382 260, 437 285 
             C 427 315, 342 318, 256 332 Z" 
          fill="url(#bookGrad)" />
    <path d="M 256 312 
             C 307 270, 382 260, 437 285 
             C 392 280, 312 288, 256 322 Z" 
          fill="url(#pageDetail)" opacity="0.6" />

    <!-- Book Center Spine -->
    <path d="M 256 302 L 256 333" stroke="#e65100" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- MAIN TITLE: JAINISM GPT -->
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <!-- "JAINISM" in Bold Crisp White -->
    <text x="210" y="382" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="1">JAINISM</text>
    
    <!-- "GPT" in Bright Golden Orange -->
    <text x="382" y="382" font-size="46" font-weight="900" fill="url(#gptGrad)" letter-spacing="1">GPT</text>
  </g>

  <!-- DIVIDER LINE WITH STAR -->
  <g opacity="0.9">
    <line x1="105" y1="404" x2="238" y2="404" stroke="url(#subtextGrad)" stroke-width="1.8" />
    <!-- Center Diamond -->
    <polygon points="256,399 261,404 256,409 251,404" fill="#ffca28" />
    <line x1="274" y1="404" x2="407" y2="404" stroke="url(#subtextGrad)" stroke-width="1.8" />
  </g>

  <!-- SUBTITLE: DIVINE WISDOM • SAMIL JAIN -->
  <text x="256" y="438" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="700" 
        fill="url(#subtextGrad)" 
        letter-spacing="3.5">DIVINE WISDOM • SAMIL JAIN</text>
</svg>