name: Build My Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Project Files
        run: |
          mkdir -p android-app/app/src/main/java/com/jainismgpt/app
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi

          # 1. settings.gradle
          echo "include ':app'" > android-app/settings.gradle

          # 2. Root build.gradle
          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # 3. App build.gradle
          cat << 'EOF' > android-app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.jainismgpt.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.jainismgpt.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          # 4. styles.xml (Forcing Absolute FullScreen and Hiding Status Bar)
          cat << 'EOF' > android-app/app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowActionBar">false</item>
              </style>
          </resources>
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Jainism GPT"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. activity_main.xml
          cat << 'EOF' > android-app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent" />
          </RelativeLayout>
          EOF

          # 7. MainActivity.java (Immersive Redirection Lock)
          cat << 'EOF' > android-app/app/src/main/java/com/jainismgpt/app/MainActivity.java
          package com.jainismgpt.app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView myWebView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  myWebView = findViewById(R.id.webview);
                  WebSettings settings = myWebView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  
                  // Strict internal routing lock
                  myWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          view.loadUrl(url);
                          return true;
                      }
                  });
                  myWebView.setWebChromeClient(new WebChromeClient());
                  myWebView.loadUrl("https://jainismgpt.vercel.app/");
              }
              @Override
              public void onBackPressed() {
                  if (myWebView.canGoBack()) { myWebView.goBack(); } else { super.onBackPressed(); }
              }
          }
          EOF

          # 8. Custom Logo Setup for Android Launcher Icon
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

          LOGO_SRC=""
          if [ -f "public/logo-512.png" ]; then
              LOGO_SRC="public/logo-512.png"
          elif [ -f "public/logo.png" ]; then
              LOGO_SRC="public/logo.png"
          elif [ -f "public/icon.png" ]; then
              LOGO_SRC="public/icon.png"
          fi

          if [ ! -z "$LOGO_SRC" ]; then
              cp "$LOGO_SRC" android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
              cp "$LOGO_SRC" android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
              cp "$LOGO_SRC" android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
              cp "$LOGO_SRC" android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp "$LOGO_SRC" android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              echo "Custom Jainism GPT logo copied to all mipmap folders from $LOGO_SRC"
          fi

      - name: Build Native Android APK
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jainism-GPT-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
