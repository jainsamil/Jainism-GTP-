name: Build My Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Web Directory and Build Android
        run: |
          mkdir -p out
          echo '<html><head><meta http-equiv="refresh" content="0;url=https://jainismgpt.vercel.app/"></head><body><h1>Loading Jainism GPT...</h1></body></html>' > out/index.html
          
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D @capacitor/assets
          
          npx cap init "Jainism GPT" "com.jainismgpt.app" --web-dir=out
          
          # Force internal rendering and navigation for vercel domain
          echo '{"appId":"com.jainismgpt.app","appName":"Jainism GPT","webDir":"out","server":{"url":"https://jainismgpt.vercel.app/","allowNavigation":["jainismgpt.vercel.app","*.vercel.app","*"]}}' > capacitor.config.json
          
          # Create asset folder and check for any custom logo images in the repository
          mkdir -p assets
          find . -name "*logo*" -o -name "*icon*" -o -name "*favicon*" | grep -E '\.(png|jpg|jpeg)$' | head -n 1 | xargs -I {} cp {} assets/icon.png
          
          # Fallback check if the above generic finder missed it
          if [ ! -f "assets/icon.png" ] && [ -f "public/logo.png" ]; then
            cp public/logo.png assets/icon.png
          fi
          
          npx cap add android
          
          # Enable Cleartext Traffic for native internal webview access
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          # Generate icons if source asset was successfully copied
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          fi
          
          npx cap sync
          
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jainism-GPT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
