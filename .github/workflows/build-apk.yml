name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova and CLI Tools
      run: |
        npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create android-app com.jainismgpt.app "Jainism GPT"
        cd android-app
        cordova platform add android@12.0.0
        
        # Configure WebView to load the Vercel URL natively
        echo '<?xml version="1.0" encoding="utf-8"?><widget id="com.jainismgpt.app" version="1.0.0" xmlns="http://w3.org" xmlns:cdv="http://apache.org"><name>Jainism GPT</name><description>Jainism GPT App</description><author email="dev@jainismgpt.com">Developer</author><content src="https://jainismgpt.vercel.app/" /><access origin="*" /><allow-intent href="http://*/*" /><allow-intent href="https://*/*" /><preference name="Fullscreen" value="false" /><preference name="Orientation" value="portrait" /></widget>' > config.xml

    - name: Build Debug APK
      run: |
        cd android-app
        cordova build android --debug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Jainism-GPT-APK
        path: android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
