name: Build My Android APK
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize Web Directory and Build Android
        run: |
          mkdir -p out
          echo '<html><body><script>window.location.href="https://vercel.app";</script></body></html>' > out/index.html
          
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          npx cap init "JainismGPT" "com.jainismgpt.app" --web-dir=out
          
          npx cap add android
          npx cap sync
          
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jainism-GPT-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
